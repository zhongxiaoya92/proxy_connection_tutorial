name: Mirror Release

on:
  workflow_dispatch:
    inputs:
      software:
        description: "选择软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG
      version:
        description: "官方 Release Tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:
      - name: 设置官方仓库
        run: |
          if [ "${{ inputs.software }}" = "FlClash" ]; then
            echo "REPO=chen08209/FlClash" >> "$GITHUB_ENV"
          elif [ "${{ inputs.software }}" = "v2rayN" ]; then
            echo "REPO=2dust/v2rayN" >> "$GITHUB_ENV"
          elif [ "${{ inputs.software }}" = "v2rayNG" ]; then
            echo "REPO=2dust/v2rayNG" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: 下载官方全部文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ inputs.version }}" --repo "$REPO" --dir release-assets

      - name: 检查文件
        run: |
          COUNT=$(find release-assets -type f | wc -l)
          echo "文件数量：$COUNT"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          if [ "$COUNT" -eq 0 ]; then
            exit 1
          fi

      - name: 设置 Release 名称
        run: |
          SOFTWARE=$(echo "${{ inputs.software }}" | tr '[:upper:]' '[:lower:]')
          echo "TAG=${SOFTWARE}-${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: 创建或使用已有 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release 已存在：$TAG"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "${{ inputs.software }} ${{ inputs.version }}" --notes "非官方镜像。原项目：https://github.com/$REPO"
          fi

      - name: 上传全部文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for FILE in release-assets/*; do
            [ -f "$FILE" ] || continue
            echo "上传：$(basename "$FILE")"
            gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
          done

      - name: 完成
        run: |
          echo "同步完成"
          echo "Release: $TAG"
```
