```yaml
name: Mirror Release

on:
  workflow_dispatch:
    inputs:
      software:
        description: "选择要同步的软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG

      version:
        description: "官方 Release Tag，例如 v0.8.98"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: 设置软件信息
        id: info
        shell: bash
        run: |
          SOFTWARE="${{ inputs.software }}"
          VERSION="${{ inputs.version }}"

          case "$SOFTWARE" in
            FlClash)
              REPO="chen08209/FlClash"
              ;;
            v2rayN)
              REPO="2dust/v2rayN"
              ;;
            v2rayNG)
              REPO="2dust/v2rayNG"
              ;;
            *)
              echo "未知的软件：$SOFTWARE"
              exit 1
              ;;
          esac

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "software=$SOFTWARE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 创建临时目录
        run: mkdir -p release-assets

      - name: 获取官方 Release 文件
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.info.outputs.repo }}
          VERSION: ${{ steps.info.outputs.version }}
        shell: bash
        run: |
          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "*.exe" \
            --pattern "*.apk" \
            --pattern "*.zip" \
            --dir release-assets

          echo "获取到的文件："
          ls -lh release-assets

      - name: 检查文件
        shell: bash
        run: |
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "没有找到 .exe、.apk 或 .zip 文件"
            exit 1
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOFTWARE: ${{ steps.info.outputs.software }}
          VERSION: ${{ steps.info.outputs.version }}
          REPO: ${{ steps.info.outputs.repo }}
        shell: bash
        run: |
          TAG="${SOFTWARE,,}-${VERSION}"

          NOTES="这是 ${SOFTWARE} 官方 Release 的非官方镜像。

          原项目：
          https://github.com/${REPO}

          官方版本：
          ${VERSION}

          本 Release 未修改原始软件文件。

          本仓库与原项目官方开发团队没有隶属关系。

          软件版权、许可证及相关声明请以原项目为准。"

          gh release create "$TAG" \
            --title "${SOFTWARE} ${VERSION}" \
            --notes "$NOTES"

      - name: 上传 Release 文件
        env:
          GH_TOKEN: ${{ github.token }}
          SOFTWARE: ${{ steps.info.outputs.software }}
          VERSION: ${{ steps.info.outputs.version }}
        shell: bash
        run: |
          TAG="${SOFTWARE,,}-${VERSION}"

          gh release upload "$TAG" \
            release-assets/* \
            --clobber

          echo "Release 上传完成：$TAG"
```
