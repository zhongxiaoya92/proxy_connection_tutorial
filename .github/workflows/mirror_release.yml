# 工作流名称
name: Mirror Release

# 只允许手动运行
on:
  workflow_dispatch:
    inputs:

      # 选择要同步的软件
      software:
        description: "选择软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG

      # 输入官方版本号
      version:
        description: "官方 Release 版本号，例如 v0.8.98"
        required: true
        type: string

# 允许 Action 创建和修改 Release
permissions:
  contents: write

# 工作任务
jobs:
  mirror:

    # 使用 GitHub 的临时 Ubuntu 环境
    runs-on: ubuntu-latest

    steps:

      # 根据选择的软件确定官方仓库
      - name: 设置软件信息
        id: info
        shell: bash
        run: |

          # 获取你选择的软件
          SOFTWARE="${{ inputs.software }}"

          # 获取你输入的版本
          VERSION="${{ inputs.version }}"

          # 根据软件选择官方 GitHub 仓库
          case "$SOFTWARE" in

            FlClash)
              REPO="chen08209/FlClash"
              ;;

            v2rayN)
              REPO="2dust/v2rayN"
              ;;

            v2rayNG)
              REPO="2dust/v2rayNG"
              ;;

            *)
              echo "未知的软件"
              exit 1
              ;;
          esac

          # 将结果传给后面的步骤
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "software=$SOFTWARE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 下载官方 Release 文件
      - name: 获取官方 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.info.outputs.repo }}
          VERSION: ${{ steps.info.outputs.version }}
        shell: bash
        run: |

          # 创建临时目录
          mkdir -p release-assets

          # 从官方 Release 获取 exe、apk、zip
          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "*.exe" \
            --pattern "*.apk" \
            --pattern "*.zip" \
            --dir release-assets

          # 显示文件
          echo "获取到的文件："
          ls -lh release-assets

      # 检查是否真的获取到了文件
      - name: 检查文件
        shell: bash
        run: |

          # 如果没有任何文件就终止
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "没有找到 exe、apk 或 zip 文件"
            exit 1
          fi

      # 创建自己的 Release
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOFTWARE: ${{ steps.info.outputs.software }}
          VERSION: ${{ steps.info.outputs.version }}
          REPO: ${{ steps.info.outputs.repo }}
        shell: bash
        run: |

          # 创建自己的 Tag
          TAG="${SOFTWARE,,}-${VERSION}"

          # 创建 Release
          gh release create "$TAG" \
            --title "$SOFTWARE $VERSION" \
            --notes "这是 $SOFTWARE 官方 Release 的非官方镜像。

原项目：
https://github.com/$REPO

官方版本：
$VERSION

本 Release 未修改原始软件文件。

本仓库与原项目官方开发团队没有隶属关系。

软件版权、许可证及相关声明请以原项目为准。"

      # 上传文件
      - name: 上传 Release 文件
        env:
          GH_TOKEN: ${{ github.token }}
          SOFTWARE: ${{ steps.info.outputs.software }}
          VERSION: ${{ steps.info.outputs.version }}
        shell: bash
        run: |

          # 获取自己的 Tag
          TAG="${SOFTWARE,,}-${VERSION}"

          # 上传所有文件
          gh release upload "$TAG" \
            release-assets/* \
            --clobber
