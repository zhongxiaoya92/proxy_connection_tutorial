name: Mirror Release

on:
  workflow_dispatch:
    inputs:
      software:
        description: "选择软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG

      version:
        description: "官方 Release Tag，例如 v0.8.98"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:

      - name: 设置官方仓库
        id: info
        shell: bash
        run: |
          if [ "${{ inputs.software }}" = "FlClash" ]; then
            echo "repo=chen08209/FlClash" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.software }}" = "v2rayN" ]; then
            echo "repo=2dust/v2rayN" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.software }}" = "v2rayNG" ]; then
            echo "repo=2dust/v2rayNG" >> "$GITHUB_OUTPUT"
          else
            echo "未知的软件"
            exit 1
          fi

      - name: 创建下载目录
        run: mkdir -p release-assets

      - name: 下载官方 Release 全部附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            "${{ inputs.version }}" \
            --repo "${{ steps.info.outputs.repo }}" \
            --dir release-assets

      - name: 检查下载结果
        run: |
          COUNT=$(find release-assets -maxdepth 1 -type f | wc -l)

          echo "下载文件数量：$COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "没有下载到任何文件"
            exit 1
          fi

          echo ""
          echo "下载的文件："
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 设置 Release Tag
        id: release
        shell: bash
        run: |
          SOFTWARE=$(echo "${{ inputs.software }}" | tr '[:upper:]' '[:lower:]')
          TAG="${SOFTWARE}-${{ inputs.version }}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "你的 Release：$TAG"

      - name: 创建或复用 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1
          then
            echo "Release 已存在：$TAG"
          else
            echo "创建 Release：$TAG"

            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "${{ inputs.software }} ${{ inputs.version }}" \
              --notes "非官方镜像。原项目：https://github.com/${{ steps.info.outputs.repo }}"
          fi

      - name: 上传全部附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          for FILE in release-assets/*; do
            if [ -f "$FILE" ]; then
              echo "上传：$(basename "$FILE")"

              gh release upload "$TAG" "$FILE" \
                --repo "${{ github.repository }}" \
                --clobber
            fi
          done

      - name: 完成
        run: |
          echo "========================================"
          echo "同步完成"
          echo "========================================"
          echo "软件：${{ inputs.software }}"
          echo "版本：${{ inputs.version }}"
          echo "Release：${{ steps.release.outputs.tag }}"
```
