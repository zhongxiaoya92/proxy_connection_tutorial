name: Mirror Release

on:
  workflow_dispatch:
    inputs:
      software:
        description: "选择要同步的软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG
      version:
        description: "官方 Release Tag，例如 v0.8.98"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: 设置软件信息
        id: info
        run: |
          if [ "${{ inputs.software }}" = "FlClash" ]; then
            echo "repo=chen08209/FlClash" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.software }}" = "v2rayN" ]; then
            echo "repo=2dust/v2rayN" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.software }}" = "v2rayNG" ]; then
            echo "repo=2dust/v2rayNG" >> "$GITHUB_OUTPUT"
          else
            echo "未知的软件"
            exit 1
          fi

          echo "software=${{ inputs.software }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 创建临时目录
        run: mkdir -p release-assets

      - name: 下载官方 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.info.outputs.version }}" \
            --repo "${{ steps.info.outputs.repo }}" \
            --pattern "*.exe" \
            --pattern "*.apk" \
            --pattern "*.zip" \
            --dir release-assets

      - name: 显示文件
        run: |
          echo "下载完成："
          ls -lh release-assets

      - name: 检查文件
        run: |
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "没有找到需要同步的文件"
            exit 1
          fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(echo "${{ steps.info.outputs.software }}" | tr '[:upper:]' '[:lower:]')-${{ steps.info.outputs.version }}"

          gh release create "$TAG" \
            --title "${{ steps.info.outputs.software }} ${{ steps.info.outputs.version }}" \
            --notes "非官方镜像。原项目：https://github.com/${{ steps.info.outputs.repo }}"

      - name: 上传文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(echo "${{ steps.info.outputs.software }}" | tr '[:upper:]' '[:lower:]')-${{ steps.info.outputs.version }}"

          gh release upload "$TAG" \
            release-assets/* \
            --clobber
