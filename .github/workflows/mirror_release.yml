name: Mirror Release

on:
  workflow_dispatch:
    inputs:
      software:
        description: "选择要同步的软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG

      version:
        description: "官方 Release Tag，例如 v0.8.98"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:
      # 检出你自己的仓库
      # gh release create 需要当前目录存在 Git 仓库
      - name: 检出当前仓库
        uses: actions/checkout@v4

      # 根据软件名称确定官方 GitHub 仓库
      - name: 设置软件信息
        id: info
        run: |
          if [ "${{ inputs.software }}" = "FlClash" ]; then
            echo "repo=chen08209/FlClash" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.software }}" = "v2rayN" ]; then
            echo "repo=2dust/v2rayN" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.software }}" = "v2rayNG" ]; then
            echo "repo=2dust/v2rayNG" >> "$GITHUB_OUTPUT"
          else
            echo "未知的软件"
            exit 1
          fi

          # 保存软件名称
          echo "software=${{ inputs.software }}" >> "$GITHUB_OUTPUT"

          # 保存官方 Release Tag
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      # 创建临时目录
      - name: 创建临时目录
        run: mkdir -p release-assets

      # 下载官方 Release 的全部文件
      - name: 下载官方 Release 全部文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.info.outputs.version }}" \
            --repo "${{ steps.info.outputs.repo }}" \
            --dir release-assets

      # 显示下载结果
      - name: 显示下载文件
        run: |
          echo "=============================="
          echo "官方 Release 文件："
          echo "=============================="

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

          echo ""
          echo "=============================="
          echo "文件数量："
          find release-assets -maxdepth 1 -type f | wc -l

          echo ""
          echo "=============================="
          echo "文件大小："
          du -sh release-assets

      # 确认确实下载到了文件
      - name: 检查文件
        run: |
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "没有找到官方 Release 文件"
            exit 1
          fi

      # 创建你自己的 Release
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(echo "${{ steps.info.outputs.software }}" | tr '[:upper:]' '[:lower:]')-${{ steps.info.outputs.version }}"

          gh release create "$TAG" \
            --title "${{ steps.info.outputs.software }} ${{ steps.info.outputs.version }}" \
            --notes "非官方镜像。原项目：https://github.com/${{ steps.info.outputs.repo }}"

      # 上传全部文件
      - name: 上传全部文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(echo "${{ steps.info.outputs.software }}" | tr '[:upper:]' '[:lower:]')-${{ steps.info.outputs.version }}"

          gh release upload "$TAG" \
            release-assets/* \
            --clobber
