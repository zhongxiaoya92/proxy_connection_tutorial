name: Mirror Release

on:
  workflow_dispatch:
    inputs:
      software:
        description: "选择软件"
        required: true
        type: choice
        options:
          - FlClash
          - v2rayN
          - v2rayNG
      version:
        description: "官方 Release Tag，例如 v0.8.98"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:
      - name: 设置软件仓库
        id: info
        shell: bash
        run: |
          case "${{ inputs.software }}" in
            FlClash)
              echo "repo=chen08209/FlClash" >> "$GITHUB_OUTPUT"
              ;;
            v2rayN)
              echo "repo=2dust/v2rayN" >> "$GITHUB_OUTPUT"
              ;;
            v2rayNG)
              echo "repo=2dust/v2rayNG" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "未知的软件"
              exit 1
              ;;
          esac

          echo "software=${{ inputs.software }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 创建下载目录
        run: mkdir -p release-assets

      - name: 下载官方 Release 全部文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.info.outputs.version }}" \
            --repo "${{ steps.info.outputs.repo }}" \
            --dir release-assets

      - name: 显示下载文件
        run: |
          echo "下载的文件："
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          echo ""
          echo "文件数量：$(find release-assets -maxdepth 1 -type f | wc -l)"
          echo "总大小：$(du -sh release-assets | cut -f1)"

      - name: 检查下载结果
        run: |
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "没有下载到文件"
            exit 1
          fi

      - name: 设置 Release Tag
        id: release
        shell: bash
        run: |
          SOFTWARE="$(echo "${{ steps.info.outputs.software }}" | tr '[:upper:]' '[:lower:]')"
          TAG="${SOFTWARE}-${{ steps.info.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $TAG"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release 已存在：$TAG"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "${{ steps.info.outputs.software }} ${{ steps.info.outputs.version }}" \
              --notes "非官方镜像。原项目：https://github.com/${{ steps.info.outputs.repo }}"
          fi

      - name: 上传全部文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          for FILE in release-assets/*; do
            if [ -f "$FILE" ]; then
              echo "上传：$(basename "$FILE")"
              gh release upload "$TAG" "$FILE" \
                --repo "${{ github.repository }}" \
                --clobber
            fi
          done

      - name: 完成
        run: |
          echo "同步完成"
          echo "软件：${{ steps.info.outputs.software }}"
          echo "版本：${{ steps.info.outputs.version }}"
          echo "Release：${{ steps.release.outputs.tag }}"
```
